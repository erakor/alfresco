<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="100" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6A4BC4"/>
      <stop offset="0.55" stop-color="#E9577A"/>
      <stop offset="1" stop-color="#FF9F55"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="600" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3E2C8C"/>
      <stop offset="1" stop-color="#241A5C"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="330" x2="0" y2="600" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFE7A3"/>
      <stop offset="1" stop-color="#FFC266"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.3"/>
    </filter>
    <filter id="bar" x="-20%" y="-50%" width="140%" height="200%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1A0E40" flood-opacity="0.45"/>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
  </defs>
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sea)"/>
  </g>
  <g clip-path="url(#body)">
    <rect x="100" y="100" width="824" height="500" fill="url(#sky)"/>
    <circle cx="512" cy="560" r="230" fill="url(#sun)"/>
    <rect x="100" y="600" width="824" height="324" fill="url(#sea)"/>
    <rect x="392" y="690" width="240" height="18" rx="9" fill="#FFB366" opacity="0.8"/>
    <rect x="432" y="744" width="160" height="16" rx="8" fill="#FF9F6E" opacity="0.6"/>
    <rect x="466" y="794" width="92" height="14" rx="7" fill="#F27A7A" opacity="0.45"/>
  </g>
  <rect x="176" y="520" width="672" height="160" rx="80" fill="#FFFFFF" filter="url(#bar)"/>
  <line x1="300" y1="554" x2="266" y2="646" stroke="#E9577A" stroke-width="34" stroke-linecap="round"/>
  <rect x="334" y="584" width="74" height="24" rx="12" fill="#3E2C8C" opacity="0.85"/>
  <rect x="424" y="584" width="150" height="24" rx="12" fill="#3E2C8C" opacity="0.25"/>
  <rect x="598" y="566" width="10" height="60" rx="5" fill="#E9577A"/>
</svg>
