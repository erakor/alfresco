# Checks that the app still compiles in Swift 6 language mode, that build.sh
# still produces the .app bundle, that workflows.json passes the app's own
# check (Launcher --check), and that the self-test passes when the app runs.
# AppKit and Carbon only exist on macOS, hence the runner.
name: Build

# Pushes build only on main: a push to a PR branch is already built by its
# pull_request run (the branch merged with main), and building it on push
# as well ran the same job twice. A branch with no PR open can be built by
# hand (workflow_dispatch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The job only reads the repo (uploading artifacts needs no token scope), so
# the token can't push or change anything, whatever the code under test does.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swiftc --version

      - name: Compile
        run: swiftc -O -parse-as-library -swift-version 6 -target "$(uname -m)-apple-macos12.0" $(find Sources -name '*.swift') -o Launcher

      - name: Build .app bundle
        run: ./build.sh

      # The app's own check (Launcher --check): exits non-zero if the file
      # doesn't decode or the app would leave part of it out.
      - name: Check workflows.json
        run: ./Launcher --check workflows.json

      # The add-workflow skill's script compiles the decoder on its own; this
      # keeps it from drifting from the source.
      - name: Check the add-workflow script
        run: |
          .claude/skills/add-workflow/scripts/check.sh workflows.json "pr #12" "jira"

      # Builds the -D SELFTEST variant and runs the app for real: the pomodoro
      # menu bar item, alert, restore after relaunch and wake from sleep. See
      # Tests/run-self-tests.sh. The PASS/FAIL list is in the run's summary.
      - name: Self-test
        run: Tests/run-self-tests.sh

      - name: Upload self-test log, screenshot and renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-test
          path: |
            build/self-test/*.log
            build/self-test/*.png
          if-no-files-found: ignore
